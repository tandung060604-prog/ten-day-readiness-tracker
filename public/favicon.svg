
  <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Background Gradient -->
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff0f5" />
        <stop offset="35%" stop-color="#ffd6e0" />
        <stop offset="70%" stop-color="#ff9aa2" />
        <stop offset="100%" stop-color="#ff758f" />
      </linearGradient>

      <!-- Golden Banner Gradient -->
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff3bf" />
        <stop offset="50%" stop-color="#ffd43b" />
        <stop offset="100%" stop-color="#f59f00" />
      </linearGradient>

      <!-- Badge Gradient -->
      <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ff8da1" />
        <stop offset="100%" stop-color="#d6336c" />
      </linearGradient>

      <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#881337" flood-opacity="0.35"/>
      </filter>

      <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>

    <!-- iOS App Background Canvas (512x512) -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Soft Cloud / Island Sunburst Backdrop -->
    <circle cx="256" cy="240" r="190" fill="#ffffff" opacity="0.35" />
    <circle cx="256" cy="240" r="150" fill="#ffffff" opacity="0.45" />

    <!-- Sparkles and Sakura Petals -->
    <text x="80" y="110" font-size="28" fill="#ffd43b">✨</text>
    <text x="400" y="120" font-size="34" fill="#ffd43b">✨</text>
    <text x="60" y="280" font-size="24">🌸</text>
    <text x="420" y="270" font-size="26">🌸</text>
    <text x="240" y="90" font-size="28">💖</text>

    <!-- Rainbow Arch -->
    <path d="M 90 220 Q 256 90 422 220" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 110 225 Q 256 110 402 225" fill="none" stroke="rgba(255,220,180,0.5)" stroke-width="8" stroke-linecap="round"/>

    <!-- Bottom Golden Ribbon Banner -->
    <g filter="url(#dropShadow)">
      <!-- Ribbon shape -->
      <rect x="56" y="380" width="400" height="88" rx="44" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
      <!-- Inner ribbon line -->
      <rect x="62" y="386" width="388" height="76" rx="38" fill="none" stroke="#d9480f" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
      
      <!-- Text: Little Days -->
      <text x="256" y="434" font-family="'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" text-anchor="middle" fill="#782333" letter-spacing="1.5">
        Little Days
      </text>
    </g>

    <!-- Top Floating Mini Tag -->
    <g filter="url(#dropShadow)">
      <rect x="166" y="32" width="180" height="42" rx="21" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2.5"/>
      <text x="256" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="1">
        HARU &amp; MAI TRANG
      </text>
    </g>
  </svg>
  